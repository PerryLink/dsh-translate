name: Feature request
description: Suggest a behaviour or a protected-span rule for dsh-translate
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to translate, and what goes wrong today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should the plugin do? Keep the display-only and fail-closed contracts in mind.
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Area
      options:
        - Translation quality / prompt
        - Protected spans (code, paths, commands, identifiers)
        - UI / controls
        - Model route / configuration
        - Performance / caching
        - Documentation
    validations:
      required: true
